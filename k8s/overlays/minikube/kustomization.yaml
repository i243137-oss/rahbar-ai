apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar

resources:
  - ../../base

# Use the existing corpus claim by keeping the base resource names.
# Override these tags together when building a different source revision.
images:
  - name: rahbar-api
    newTag: f9727ae
  - name: rahbar-indexer
    newTag: f9727ae

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: CronJob
      name: reindex
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/resources/requests/memory
        value: 2Gi
  - target:
      kind: StatefulSet
      name: chroma
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: add
        path: /data/ALLOW_FIXTURE_FALLBACK
        value: "false"
      - op: add
        path: /data/ENABLE_CACHE
        value: "false"
      - op: add
        path: /data/EMBED_BATCH_SIZE
        value: "8"
      - op: add
        path: /data/LLM_TIMEOUT
        value: "180"
  # The first ingestion is started explicitly after checking storage and Ollama.
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: indexer-init
        namespace: rahbar
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api-hpa
        namespace: rahbar
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ui
        namespace: rahbar
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: ui
        namespace: rahbar
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: rahbar-ingress
        namespace: rahbar
