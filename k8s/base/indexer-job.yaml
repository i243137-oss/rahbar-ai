apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-init
  namespace: rahbar
  labels:
    app.kubernetes.io/name: indexer
    app.kubernetes.io/part-of: rahbar
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: indexer
    spec:
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
