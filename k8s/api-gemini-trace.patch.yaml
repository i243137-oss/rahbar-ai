spec:
  template:
    spec:
      containers:
        - name: api
          image: rahbar-api:assignment3-trace-v3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: LLM_PROVIDER
              value: hosted
            - name: LLM_MODEL
              value: gemini-3-flash-preview
            - name: HOSTED_BASE_URL
              value: https://generativelanguage.googleapis.com/v1beta/openai/
            - name: QUERY_TRACE_DIR
              value: /traces
          volumeMounts:
            - name: query-traces
              mountPath: /traces
      volumes:
        - name: query-traces
          persistentVolumeClaim:
            claimName: query-traces
