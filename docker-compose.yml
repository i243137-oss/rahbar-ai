services:
  api:
    image: itxumairhassan/rahbar-api:dev
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RETRIEVER=chroma
      - LLM_PROVIDER=hosted
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=rahbar
      - EMBED_MODEL=nomic-embed-text
      - EMBED_DIM=768
      - OLLAMA_URL=http://host.docker.internal:11434
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
      - path: ./api/.env
        required: false
    depends_on:
      - chroma
    restart: unless-stopped

  ui:
    image: itxumairhassan/rahbar-ui:dev
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.0.12
    ports:
      - "8002:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma-data:/data
    restart: unless-stopped

volumes:
  chroma-data:
