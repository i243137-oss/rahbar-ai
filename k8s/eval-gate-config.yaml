apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-gate-config
  namespace: rahbar
data:
  gate.yaml: |
    version: "1.0"
    name: rahbar-rag-release-gate
    retrieval:
      min_recall_at_3: 0.65
      min_recall_at_5: 0.70
      min_mrr: 0.60
      min_ndcg_at_5: 0.70
      max_recall_at_5_drop: 0.05
      max_ndcg_at_5_drop: 0.05
      min_noise_retention_pct: 85.0
      max_chunk_amplification_ratio: 1.50
    generation:
      require_generation_metrics: true
      min_groundedness: 0.80
      min_citation_precision: 0.80
