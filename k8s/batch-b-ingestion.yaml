{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "batch-b-corpus",
        "namespace": "rahbar"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "kind": "Job",
      "apiVersion": "batch/v1",
      "metadata": {
        "name": "ingest-batch-b-demo",
        "namespace": "rahbar"
      },
      "spec": {
        "backoffLimit": 0,
        "template": {
          "metadata": {
            "labels": {
              "app": "indexer"
            }
          },
          "spec": {
            "volumes": [
              {
                "name": "corpus-volume",
                "persistentVolumeClaim": {
                  "claimName": "batch-b-corpus"
                }
              }
            ],
            "containers": [
              {
                "name": "indexer",
                "image": "rahbar-indexer:f9727ae",
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "rahbar-config"
                    }
                  }
                ],
                "resources": {
                  "limits": {
                    "cpu": "2",
                    "memory": "4Gi"
                  },
                  "requests": {
                    "cpu": "500m",
                    "memory": "1Gi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "corpus-volume",
                    "mountPath": "/corpus"
                  }
                ],
                "terminationMessagePath": "/dev/termination-log",
                "terminationMessagePolicy": "File",
                "imagePullPolicy": "IfNotPresent",
                "securityContext": {
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "allowPrivilegeEscalation": false
                },
                "env": [
                  {
                    "name": "CHROMA_COLLECTION",
                    "value": "rahbar-batch-b-demo"
                  }
                ]
              }
            ],
            "restartPolicy": "Never",
            "terminationGracePeriodSeconds": 30,
            "dnsPolicy": "ClusterFirst",
            "serviceAccountName": "indexer-sa",
            "serviceAccount": "indexer-sa",
            "automountServiceAccountToken": false,
            "securityContext": {
              "runAsUser": 10001,
              "runAsGroup": 10001,
              "runAsNonRoot": true,
              "fsGroup": 10001
            },
            "schedulerName": "default-scheduler"
          }
        }
      }
    }
  ]
}
