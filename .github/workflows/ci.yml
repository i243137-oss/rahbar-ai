name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run Ruff linter
        run: |
          ruff check api indexer eval

      - name: Run Mypy type checker
        run: |
          mypy api/app

  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run API tests with coverage
        env:
          RETRIEVER: stub
          LLM_PROVIDER: stub
          ENABLE_CACHE: "false"
        run: |
          cd api && pytest -v --cov=app --cov-report=term-missing --cov-fail-under=60

      - name: Run Indexer tests
        run: |
          cd indexer && pytest -v

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.4.1"

      - name: Install Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate dev overlay manifests
        run: |
          kustomize build k8s/overlays/dev | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0

      - name: Validate prod overlay manifests
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.30.0

  build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: api
          push: false
          tags: rahbar-api:${{ github.sha }}

      - name: Build Indexer image
        uses: docker/build-push-action@v5
        with:
          context: indexer
          push: false
          tags: rahbar-indexer:${{ github.sha }}

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: false
          tags: rahbar-ui:${{ github.sha }}

  scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local API image for scanning
        uses: docker/build-push-action@v5
        with:
          context: api
          load: true
          tags: rahbar-api:scan

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-api:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          trivyignores: .trivyignore

  e2e-eval:
    name: E2E Cluster Evaluation Gate
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker build -t rahbar-api:dev api
          docker build -t rahbar-indexer:dev indexer
          docker build -t rahbar-ui:dev ui
          kind load docker-image rahbar-api:dev --name rahbar-ci
          kind load docker-image rahbar-indexer:dev --name rahbar-ci
          kind load docker-image rahbar-ui:dev --name rahbar-ci

      - name: Deploy manifests and run real indexer pipeline
        run: |
          kubectl apply -k k8s/overlays/dev
          echo "Waiting for ChromaDB data tier to be ready..."
          kubectl wait -n rahbar --for=condition=ready pod -l app=chroma --timeout=180s
          echo "Waiting for real indexer Job to populate Chroma collection from fixtures..."
          kubectl wait -n rahbar --for=condition=complete job/dev-indexer-init --timeout=180s || (kubectl describe job/dev-indexer-init -n rahbar && kubectl logs -n rahbar job/dev-indexer-init && exit 1)

      - name: Verify Chroma collection, metadata, and vector dimensions
        run: |
          kubectl port-forward -n rahbar svc/dev-chroma 8002:8000 &
          CHROMA_PID=$!
          sleep 4
          pip install chromadb-client==1.0.12
          python3 -c "
          import chromadb
          client = chromadb.HttpClient(host='localhost', port=8002)
          col = client.get_collection('rahbar')
          count = col.count()
          meta = col.metadata
          print(f'Chroma collection verified: {count} chunks, model={meta.get(\"embed_model\")}, dim={meta.get(\"dimension\")}')
          assert count > 0, 'Collection is empty'
          assert meta.get('dimension') == 768, f'Wrong dimension: {meta.get(\"dimension\")}'
          assert meta.get('embed_model') == 'dummy-768', f'Wrong model: {meta.get(\"embed_model\")}'
          "
          kill $CHROMA_PID || true

      - name: Wait for API rollout with real Chroma retrieval
        run: |
          kubectl rollout status deployment/dev-api -n rahbar --timeout=180s

      - name: Run E2E evaluation gate against cluster
        run: |
          kubectl port-forward -n rahbar deployment/dev-api 8000:8000 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/healthz | grep -q "alive"; then
              echo "API is healthy and ready for evaluation."
              break
            fi
            sleep 2
          done
          pip install httpx pyyaml
          python eval/run_eval.py --golden eval/fixtures/golden.fixture.yaml --api http://localhost:8000
          kill $PID || true
