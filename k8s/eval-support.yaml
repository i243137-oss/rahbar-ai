apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eval-results
  namespace: rahbar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluator-to-api
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: evaluator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluator-to-minikube-ollama
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: evaluator
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.49.1/32
      ports:
        - protocol: TCP
          port: 11434
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-evaluator
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: evaluator
      ports:
        - protocol: TCP
          port: 8000
