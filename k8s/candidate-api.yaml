{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "api-candidate",
        "namespace": "rahbar"
      },
      "spec": {
        "progressDeadlineSeconds": 600,
        "replicas": 1,
        "revisionHistoryLimit": 10,
        "selector": {
          "matchLabels": {
            "app": "api-candidate"
          }
        },
        "strategy": {
          "rollingUpdate": {
            "maxSurge": 1,
            "maxUnavailable": 0
          },
          "type": "RollingUpdate"
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "api-candidate"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "env": [
                  {
                    "name": "QUERY_TRACE_DIR",
                    "value": "/traces"
                  },
                  {
                    "name": "LLM_API_KEY",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "LLM_API_KEY",
                        "name": "rahbar-secret",
                        "optional": true
                      }
                    }
                  },
                  {
                    "name": "LLM_PROVIDER",
                    "value": "hosted"
                  },
                  {
                    "name": "LLM_MODEL",
                    "value": "gemini-3-flash-preview"
                  },
                  {
                    "name": "HOSTED_BASE_URL",
                    "value": "https://generativelanguage.googleapis.com/v1beta/openai"
                  },
                  {
                    "name": "CHROMA_COLLECTION",
                    "value": "rahbar-candidate-400-50"
                  }
                ],
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "rahbar-config"
                    }
                  }
                ],
                "image": "rahbar-api:assignment3-trace-v3",
                "imagePullPolicy": "IfNotPresent",
                "lifecycle": {
                  "preStop": {
                    "exec": {
                      "command": [
                        "/bin/sh",
                        "-c",
                        "sleep 5"
                      ]
                    }
                  }
                },
                "livenessProbe": {
                  "failureThreshold": 3,
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8000,
                    "scheme": "HTTP"
                  },
                  "periodSeconds": 20,
                  "successThreshold": 1,
                  "timeoutSeconds": 1
                },
                "name": "api",
                "ports": [
                  {
                    "containerPort": 8000,
                    "name": "http",
                    "protocol": "TCP"
                  }
                ],
                "readinessProbe": {
                  "failureThreshold": 3,
                  "httpGet": {
                    "path": "/readyz",
                    "port": 8000,
                    "scheme": "HTTP"
                  },
                  "periodSeconds": 10,
                  "successThreshold": 1,
                  "timeoutSeconds": 1
                },
                "resources": {
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  },
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  },
                  "readOnlyRootFilesystem": true
                },
                "startupProbe": {
                  "failureThreshold": 30,
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8000,
                    "scheme": "HTTP"
                  },
                  "periodSeconds": 2,
                  "successThreshold": 1,
                  "timeoutSeconds": 1
                },
                "terminationMessagePath": "/dev/termination-log",
                "terminationMessagePolicy": "File",
                "volumeMounts": [
                  {
                    "mountPath": "/traces",
                    "name": "query-traces"
                  },
                  {
                    "mountPath": "/tmp",
                    "name": "tmp-volume"
                  }
                ]
              }
            ],
            "dnsPolicy": "ClusterFirst",
            "restartPolicy": "Always",
            "schedulerName": "default-scheduler",
            "securityContext": {
              "fsGroup": 10001,
              "runAsGroup": 10001,
              "runAsNonRoot": true,
              "runAsUser": 10001
            },
            "serviceAccount": "api-sa",
            "serviceAccountName": "api-sa",
            "terminationGracePeriodSeconds": 30,
            "volumes": [
              {
                "name": "query-traces",
                "persistentVolumeClaim": {
                  "claimName": "query-traces"
                }
              },
              {
                "emptyDir": {},
                "name": "tmp-volume"
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "api-candidate",
        "namespace": "rahbar"
      },
      "spec": {
        "selector": {
          "app": "api-candidate"
        },
        "ports": [
          {
            "name": "http",
            "port": 8000,
            "targetPort": 8000
          }
        ]
      }
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "candidate-api-network",
        "namespace": "rahbar"
      },
      "spec": {
        "podSelector": {
          "matchLabels": {
            "app": "api-candidate"
          }
        },
        "policyTypes": [
          "Ingress",
          "Egress"
        ],
        "ingress": [
          {
            "from": [
              {
                "podSelector": {
                  "matchLabels": {
                    "app": "evaluator"
                  }
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 8000
              }
            ]
          }
        ],
        "egress": [
          {
            "to": [
              {
                "podSelector": {
                  "matchLabels": {
                    "app": "chroma"
                  }
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 8000
              }
            ]
          },
          {
            "to": [
              {
                "ipBlock": {
                  "cidr": "192.168.49.1/32"
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 11434
              }
            ]
          },
          {
            "ports": [
              {
                "protocol": "TCP",
                "port": 443
              }
            ]
          }
        ]
      }
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "candidate-to-chroma",
        "namespace": "rahbar"
      },
      "spec": {
        "podSelector": {
          "matchLabels": {
            "app": "chroma"
          }
        },
        "policyTypes": [
          "Ingress"
        ],
        "ingress": [
          {
            "from": [
              {
                "podSelector": {
                  "matchLabels": {
                    "app": "api-candidate"
                  }
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 8000
              }
            ]
          }
        ]
      }
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "evaluator-to-candidate",
        "namespace": "rahbar"
      },
      "spec": {
        "podSelector": {
          "matchLabels": {
            "app": "evaluator"
          }
        },
        "policyTypes": [
          "Egress"
        ],
        "egress": [
          {
            "to": [
              {
                "podSelector": {
                  "matchLabels": {
                    "app": "api-candidate"
                  }
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 8000
              }
            ]
          }
        ]
      }
    }
  ]
}
