name: CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Suite Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt

      - name: Run API tests
        env:
          RETRIEVER: stub
          LLM_PROVIDER: stub
          ENABLE_CACHE: "false"
        run: |
          cd api && pytest -q

  build-push:
    name: Build & Push Immutable SHA Images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}

      - name: Build and push Indexer image
        uses: docker/build-push-action@v5
        with:
          context: indexer
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy to Cluster & Verify Rollout
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Ephemeral Validation Cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: rahbar-prod

      - name: Configure Ingress Addon
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s || true

      - name: Set Image Tags in Overlay
        run: |
          cd k8s/overlays/prod
          kustomize edit set image docker.io/i243137/rahbar-api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          kustomize edit set image docker.io/i243137/rahbar-indexer=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          kustomize edit set image docker.io/i243137/rahbar-ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

      - name: Deploy Manifests
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Wait for Rollout Status
        run: |
          kubectl rollout status deployment/api -n rahbar --timeout=180s

      - name: Run Smoke Tests
        run: |
          kubectl get pods,services,ingress,hpa -n rahbar
          kubectl get endpoints -n rahbar
          # Smoke test process liveness
          kubectl exec -n rahbar deploy/api -- curl -s http://localhost:8000/healthz | grep "alive"
